server:
  port: ${CONFIG_SERVER_PORT:8888}

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/devnam1210/ats-config-repo.git}
          default-label: ${CONFIG_GIT_LABEL:main}
          try-master-branch: false
          clone-on-start: true
          timeout: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
